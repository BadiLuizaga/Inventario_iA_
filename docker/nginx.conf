server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  server_tokens off;

  # Cabeceras de seguridad (iframes solo del mismo sitio: vista previa del mapa de calor en el panel)
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  # Cámara solo para este sitio (herramienta de almacén)
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
  # Orígenes permitidos: CDN de librerías, Google Fonts, Supabase y Teachable Machine
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://teachablemachine.withgoogle.com https://storage.googleapis.com https://cdn.jsdelivr.net; media-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

  # Comprobación de salud del contenedor
  location = /salud { access_log off; default_type text/plain; return 200 "ok\n"; }

  # La configuración y las páginas no se cachean (cambian al desplegar)
  location = /js/config.js { add_header Cache-Control "no-store" always; add_header X-Content-Type-Options "nosniff" always; }
  location ~* \.html$ { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options "nosniff" always; add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always; add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://teachablemachine.withgoogle.com https://storage.googleapis.com https://cdn.jsdelivr.net; media-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always; add_header X-Frame-Options "SAMEORIGIN" always; add_header Referrer-Policy "strict-origin-when-cross-origin" always; }
  location ~* \.(css|js|png|webmanifest)$ { add_header Cache-Control "public, max-age=3600" always; add_header X-Content-Type-Options "nosniff" always; }

  # Nada de archivos ocultos
  location ~ /\. { deny all; }

  location / { try_files $uri $uri/ =404; }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
